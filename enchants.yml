# Enchantment shop. Hold the item in your main hand, open its category and click an enchant to buy it.
# Enchant format: 'name:level'  or  'name:level:price'  (name = vanilla enchant id, e.g. sharpness)
# slot: position in the enchant main menu (5 rows, slots 0-44)
button:
  slot: 23
  material: ENCHANTED_BOOK
  name: '&d&lENCHANTMENTS'
  description:
    - '&7Enchant the item in your hand'
    - '&7with powerful enchantments.'

price: 70000   # default price for every enchant

categories:
  helmet:
    slot: 10
    icon: DIAMOND_HELMET
    name: 'HELMET'
    item-suffix: _HELMET
    enchants:
      - 'protection:4'
      - 'mending:1'
      - 'respiration:3'
      - 'aqua_affinity:1'
      - 'unbreaking:3'
      - 'thorns:3'
  chestplate:
